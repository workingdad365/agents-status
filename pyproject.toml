[project]
name = "agents-status"
version = "0.1.0"
description = "AI coding agent status and update TUI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "textual>=6.0,<7",
]

[project.scripts]
agents-status = "agents_status.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents_status"]

[dependency-groups]
dev = []
