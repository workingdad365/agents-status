[project]
name = "agents-status"
dynamic = ["version"]
description = "AI coding agent status and update TUI"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2026.1.4",
    "textual>=6.0,<7",
    "truststore>=0.10,<1",
]

[project.scripts]
agents-status = "agents_status.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agents_status/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["agents_status"]

[tool.hatch.build.targets.wheel.force-include]
"GLOBAL_INSTRUCTIONS.md" = "agents_status/GLOBAL_INSTRUCTIONS.md"

[dependency-groups]
dev = []
